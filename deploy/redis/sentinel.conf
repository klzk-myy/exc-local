# Redis Sentinel — 3-instance quorum=2 topology (spec §4.5, Task 1.3.9)
bind 0.0.0.0
protected-mode no
port 26379
daemonize no
dir /tmp

# Monitor the primary by its PINNED redis-ha address (docker-compose.dev.yml:
# 10.99.0.11). Deliberately NOT the container name: when the primary dies its
# DNS record dies with it, and sentinel's synchronous getaddrinfo stalls the
# event loop (+tilt), aborting every in-flight failover — observed live in the
# 1.3.9 drill. resolve-hostnames/announce-hostnames are intentionally absent:
# no hostname may enter the failover-critical path. Post-failover the promoted
# replica is announced as its pinned IP (10.99.0.12/13), which the Go failover
# client rewrites for host-side use (announce_map / host_probe).
sentinel monitor mymaster 10.99.0.11 6379 2
sentinel down-after-milliseconds mymaster 2000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
