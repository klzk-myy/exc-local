# Redis 7 — coordination/instance config (spec §4, Phase-01 Task 1.3.4/1.3.9)
# This instance holds coordination keys: leader leases, degradation mode,
# circuit breakers, halts — none may be evicted. Cache traffic lives on the
# separate redis-cache instance with volatile-lru.

bind 0.0.0.0
protected-mode no
port 6379
daemonize no
dir /data

# AOF persistence
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"

# Memory: coordination keys must never be evicted
maxmemory 4gb
maxmemory-policy noeviction

# Keyspace notifications for non-critical pub/sub consumers
notify-keyspace-events "KEA"

# Write safety: refuse writes unless at least 1 replica is <5s behind
min-replicas-to-write 1
min-replicas-max-lag 5
# Spec §4.5: 512MB replication backlog for partial resync after failover
repl-backlog-size 512mb

# Save points as extra safety on top of AOF
save 900 1
save 300 10
save 60 10000
