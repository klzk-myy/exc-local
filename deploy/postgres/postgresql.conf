# -----------------------------------------------------------------------------
# PostgreSQL PITR configuration fragment — Task 4.3.4 (spec §18.1/§18.2)
#
# Continuous WAL archiving + nightly pg_basebackup give point-in-time recovery
# with the canonical targets:
#     RPO <= 15s   (archive_timeout below)
#     RTO <= 5 min (restore base backup + WAL replay; see restore_pitr.sh)
#
# Activate by appending to the instance's postgresql.conf:
#     include = '/path/to/deploy/postgres/postgresql.conf'
# (or `include_if_exists` when this file is optional). Values here are the
# PITR block only; keep site-specific listen/memory settings elsewhere.
# -----------------------------------------------------------------------------

# Required for streaming replication, pg_basebackup -Xs and WAL archiving.
wal_level = replica

# Continuous archiving: every completed (or archive_timeout-forced) WAL segment
# is handed to wal_archive.sh, which pushes to S3 (PITR_ARCHIVE_BACKEND=s3) or
# to a local/NFS directory (PITR_ARCHIVE_BACKEND=local, dev default).
archive_mode = on
archive_command = 'PITR_ARCHIVE_BACKEND=${PITR_ARCHIVE_BACKEND:-local} PITR_ARCHIVE_DIR=${PITR_ARCHIVE_DIR:-/var/lib/postgresql/wal_archive} PITR_S3_URI=${PITR_S3_URI:-s3://exchange-pitr} /opt/exchange/deploy/postgres/wal_archive.sh %p %f'

# Force a WAL switch at least every 15s so that even a quiet database archives
# its newest committed transactions. This is what bounds RPO at <= 15s.
archive_timeout = 15

# Keep enough WAL on the primary for a lagging standby/base backup to catch up
# without needing the archive (2 GiB); archive is still the zero-loss guard.
wal_keep_size = '2GB'
max_wal_senders = 10

# Hot standby allows the warm-standby topology of spec §18.2 and lets a
# promoted replica serve reads during a restore rehearsal.
hot_standby = on

# Commit timestamps give recovery_target_time second-level precision
# (spec §18.1 PITR restore to an explicit timestamp).
track_commit_timestamp = on

# Required by pg_basebackup full-page image handling on restored clusters.
full_page_writes = on

# -----------------------------------------------------------------------------
# Restore side (do NOT enable on the primary — restore_pitr.sh writes these
# into postgresql.auto.conf of the *restored* cluster together with
# recovery.signal):
#
#   restore_command = 'PITR_ARCHIVE_BACKEND=local PITR_ARCHIVE_DIR=/archive \
#       /opt/exchange/deploy/postgres/wal_restore.sh %f %p'
#   recovery_target_time    = '2026-09-14 12:00:00+00'
#   recovery_target_action  = 'promote'
#   recovery_target_timeline = 'latest'
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Observability — Task 14.3.6 (production hardening; non-PITR)
#
# Log every statement slower than 100ms. The exchange's p99 OLTP budget is
# single-digit ms, so 100ms catches genuine outliers — runaway scans,
# lock waits, planner regressions — without flooding the log with normal
# traffic. Triage path: docs/runbooks/postgres-failover.md for failover
# correlation, and the §19.3 latency-SLO dashboards for trend.
# -----------------------------------------------------------------------------
log_min_duration_statement = 100ms
