# /etc/systemd/system/postgresql@16-main.service.d/override.conf
# (§19.13.1 postgres+pgbouncer row — Debian PG16 unit retained; drop-in adds
# exchange supervision. Semi-sync replication per spec §4.5/§18.3: RPO≤15s).
[Service]
Restart=always
RestartSec=5s
# Fast shutdown but never SIGKILL mid-commit.
TimeoutStopSec=120s
LimitNOFILE=1048576
LimitCORE=infinity
OOMScoreAdjust=-800
SyslogIdentifier=postgresql
