# /etc/systemd/system/clickhouse-server.service.d/override.conf
# (§19.13.1 clickhouse-server row — distro unit retained; this drop-in adds
# exchange supervision policy).
[Service]
Restart=always
RestartSec=5s
# Merge/insert drain — CH needs longer.
TimeoutStopSec=60s
LimitNOFILE=1048576
LimitCORE=infinity
# Analytics may be sacrificed before core.
OOMScoreAdjust=-600
IOWeight=500
SyslogIdentifier=clickhouse-server
