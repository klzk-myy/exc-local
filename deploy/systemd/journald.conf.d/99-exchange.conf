# /etc/systemd/journald.conf.d/99-exchange.conf — journald policy for
# bare-metal exchange hosts (Task 9.3.28).
#
# WAL and order-flow logs are forensic evidence (MiFID II RTS 6 5-year
# retention): persistent journals, generous-but-bounded caps, and no
# rate-limiting drops for exchange units (a dropped FATAL line is a
# compliance defect).
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=4G
SystemKeepFree=2G
SystemMaxFileSize=256M
MaxRetentionSec=180day            # forward to the archival pipeline; the
                                  # 5y duty lives in the S3 WORM store
RateLimitIntervalSec=0            # never drop exchange daemon logs
RateLimitBurst=0
ForwardToSyslog=no                # loki/vector agent reads the journal directly
Seal=yes                          # FSS sealing: tamper evidence for audit
