# Out-of-band Secrets for the kind drill — the documented fallback in
# deploy/k8s/README.md ("If ESO is not installed, create the same-named
# Secrets out-of-band"). 02-externalsecret.yaml targets Vault/KMS, which a
# local kind cluster does not have; these DUMMY values only satisfy the
# pods' secretKeyRef wiring. Never reuse them outside a throwaway cluster.
apiVersion: v1
kind: Secret
metadata:
  name: exchange-db
  namespace: exchange
type: Opaque
stringData:
  dsn: "postgres://exchange:exchange_dev@127.0.0.1:5432/exchange?sslmode=disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: exchange-secrets
  namespace: exchange
type: Opaque
stringData:
  # config.Load() requires secrets.data_key to decode to exactly 32 bytes
  # (base64 or hex) in production. 32 zero bytes, base64 — throwaway only.
  data-key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
