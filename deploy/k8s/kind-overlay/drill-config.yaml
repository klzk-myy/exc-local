# Drill config file mounted at /etc/exchange-drill/config.yaml and selected
# via EXC_CONFIG (patch in kustomization.yaml).
#
# Why a file at all: this drill was built while services/internal/config
# silently dropped EXC_SECRETS_DATA_KEY (viper AutomaticEnv only binds keys
# with a registered default — fixed 2026-09-30, regression test in
# internal/config/config_test.go). The Deployment's secretKeyRef env now
# satisfies validation on its own; the mounted file is retained so the
# drill boots even if a stale binary is built from an older tree. Values
# here are throwaway drill dummies, not real secret material (real
# data_key comes from Vault/KMS per Task 13.5.3.5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: settlement-drill-config
  namespace: exchange
data:
  config.yaml: |
    secrets:
      # 32 zero bytes, base64 — satisfies DecodeDataKey length check only.
      data_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
