# Secrets — never inline (spec §19.6 / secrets inventory migration 089).
# ExternalSecrets CRDs (external-secrets.io) pull from Vault/KMS into K8s
# Secret objects; pods reference them via envFrom secretRef. If ESO is not
# installed, create the same Secret names out-of-band:
#   kubectl -n exchange create secret generic exchange-db \
#       --from-literal=dsn='postgres://...'
#   kubectl -n exchange create secret generic exchange-secrets \
#       --from-literal=data-key='<base64 32B>'
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: exchange-db
  namespace: exchange
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend          # ClusterSecretStore/SecretStore — provisioned by platform
    kind: SecretStore
  target:
    name: exchange-db
    creationPolicy: Owner
  data:
    - secretKey: dsn
      remoteRef:
        key: exchange/production/postgres
        property: dsn            # postgres://exchange:***@pgbouncer:6432/exchange
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: exchange-secrets
  namespace: exchange
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: exchange-secrets
    creationPolicy: Owner
  data:
    # AES-256-GCM data key — services refuse to boot without it in
    # production (config.Validate, fail-closed spec §2.7).
    - secretKey: data-key
      remoteRef:
        key: exchange/production/secrets
        property: data-key-b64
    - secretKey: jwt-hs256-key-b64
      remoteRef:
        key: exchange/production/secrets
        property: jwt-hs256-key-b64
    - secretKey: redis-password
      remoteRef:
        key: exchange/production/redis
        property: password
    - secretKey: fix-mtls-keystore
      remoteRef:
        key: exchange/production/fix
        property: mtls-keystore-p12-b64
---
# Object-store credentials for the partition archiver / market-data exporter
# (S3 WORM buckets, spec §19.7).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: exchange-s3
  namespace: exchange
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: exchange-s3
    creationPolicy: Owner
  data:
    - secretKey: endpoint
      remoteRef: {key: exchange/production/s3, property: endpoint}
    - secretKey: region
      remoteRef: {key: exchange/production/s3, property: region}
    - secretKey: access-key-id
      remoteRef: {key: exchange/production/s3, property: access-key-id}
    - secretKey: secret-access-key
      remoteRef: {key: exchange/production/s3, property: secret-access-key}
