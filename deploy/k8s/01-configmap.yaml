# Non-secret shared configuration (Phase-09 Task 9.3.2).
# Maps onto the shared config loader (services/internal/config/config.go):
# EXC_ env vars override config.yaml keys. SECRET MATERIAL NEVER GOES HERE —
# credentials resolve through the ExternalSecrets in 02-externalsecret.yaml
# (Vault/KMS per Phase-13.5 Task 13.5.3.5 / secrets inventory migration 089).
apiVersion: v1
kind: ConfigMap
metadata:
  name: exchange-env
  namespace: exchange
data:
  EXC_ENVIRONMENT: "production"
  EXC_LOGGING_LEVEL: "info"
  EXC_LOGGING_FORMAT: "json"
  # NATS JetStream 3-node cluster (§19.13.1 nats-server row).
  EXC_NATS_URLS: "nats://nats-0.nats.exchange.svc:4222,nats://nats-1.nats.exchange.svc:4222,nats://nats-2.nats.exchange.svc:4222"
  # Redis Sentinel discovery (spec §4.5). Data-plane replicas resolve via
  # sentinel, never directly.
  EXC_SENTINEL_ADDRS: "redis-sentinel-0.redis-ha.exchange.svc:26379,redis-sentinel-1.redis-ha.exchange.svc:26379,redis-sentinel-2.redis-ha.exchange.svc:26379"
  # Direct-dial master endpoint for non-sentinel-aware daemons
  # (config.Load validates redis.addr as host:port). Sentinel-aware
  # components resolve the current master via EXC_SENTINEL_ADDRS + the
  # master_name in config/redis-sentinel.yaml ("mymaster" by default) —
  # the monitor name is NOT a dialable address and must never appear
  # here (net.ResolveTCPAddr rejects it -> config.Load crashloop).
  EXC_REDIS_ADDR: "redis-ha.exchange.svc:6379"
  EXC_SHARDING_CONFIG: "/etc/exchange/sharding.yaml"
  # ClickHouse analytics cluster (Phase-20, spec §16). Native protocol
  # endpoint consumed by cmd/analytics (ingest) and cmd/gateway (read
  # side); credentials ride the exchange-analytics ExternalSecret.
  EXC_CH_NATIVE_URL: "clickhouse.exchange.svc:9000"
  EXC_CH_DATABASE: "exchange_analytics"
  EXC_CH_SPOOL_DIR: "/var/spool/exchange/clickhouse_buffer"
  # Report/document retention bucket — statements, confirmations,
  # invoices, RTS28 summaries (5–7y per §19.12/§16.8). Server-side
  # encryption + retention policy are bucket-side per §19.7 WORM posture.
  EXC_REPORTS_S3_BUCKET: "exchange-reports"
---
# Ship config/sharding.yaml verbatim — it is the single source of truth for
# symbol→shard mapping (Task 1.3.7) parsed by both Go and C++.
apiVersion: v1
kind: ConfigMap
metadata:
  name: exchange-sharding
  namespace: exchange
data:
  sharding.yaml: |
    version: 1
    elastic:
      base_shard: 4
      num_shards: 4
    shards:
      0: [EUR/USD, GBP/USD, USD/CHF]
      1: [USD/JPY, AUD/USD, NZD/USD]
      2: [USD/CAD, USD/MXN, USD/BRL]
      3: [EUR/GBP, EUR/JPY, EUR/CHF]
