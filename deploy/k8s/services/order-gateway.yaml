  replicas: 0                        # idle color scales on demand at deploy time
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: order-gateway
      exchange/color: green
