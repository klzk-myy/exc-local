            - name: EXC_TRUST_PROXY
              value: "1"
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: ["sh", "-c", "sleep 30"]}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits:   {cpu: "1",  memory: 512Mi}
          securityContext:
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: sharding, mountPath: /etc/exchange, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: sharding
          configMap: {name: exchange-sharding}
---
apiVersion: v1
kind: Service
metadata:
  name: order-gateway-green
  namespace: exchange
  labels:
    app.kubernetes.io/name: order-gateway
    exchange/color: green
spec:
  type: ClusterIP
  ports:
    - {name: http, port: 8080, targetPort: http}
  selector:
    app.kubernetes.io/name: order-gateway
    exchange/color: green
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-gateway-green
  namespace: exchange
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-gateway-green
  minReplicas: 0                     # zero while idle — HPA wakes on scale-up
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Pods, value: 1, periodSeconds: 60}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-gateway-green
  namespace: exchange
spec:
  minAvailable: 0                    # idle color may go to zero
  selector:
    matchLabels:
      app.kubernetes.io/name: order-gateway
      exchange/color: green
