# settlement-service — T+1/T+2 batching, GL double-entry posting (§19.13.1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-service
  namespace: exchange
  labels: {app.kubernetes.io/name: settlement-service, app.kubernetes.io/part-of: exchange}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: settlement-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: settlement-service}
    spec:
      serviceAccountName: exchange-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: settlement
          image: registry.internal/exchange/settlement-service:CHANGE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - {name: health, containerPort: 8083}
          envFrom:
            - configMapRef: {name: exchange-env}
          env:
            - name: EXC_POSTGRES_DSN
              valueFrom: {secretKeyRef: {name: exchange-db, key: dsn}}
            - name: EXC_SECRETS_DATA_KEY
              valueFrom: {secretKeyRef: {name: exchange-secrets, key: data-key}}
            - name: EXC_SETTLEMENT_HOST
              value: "0.0.0.0"
          # R9 schema — served via observability.ServeMetrics on :8083 since
          # the probe-coverage fix (2026-09-30); legacy /healthz kept.
          readinessProbe:
            httpGet: {path: /health/ready, port: health}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: health}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: ["sh", "-c", "sleep 30"]}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits:   {cpu: "1",  memory: 512Mi}
          securityContext:
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-service
  namespace: exchange
spec:
  type: ClusterIP
  ports:
    - {name: health, port: 8083, targetPort: health}
  selector: {app.kubernetes.io/name: settlement-service}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: settlement-service
  namespace: exchange
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: settlement-service}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
    - type: Pods
      pods:
        metric: {name: settlement_queue_depth}
        target: {type: AverageValue, averageValue: "10000"}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: settlement-service
  namespace: exchange
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: settlement-service}
