  - jurisdiction_code: ROW
    home_region: eu-central
    kms_key_id: arn:aws:kms:eu-central-1:000000000000:key/exc-eu-resident
    s3_bucket: exc-eu-resident-data
    pg_partition: pg_eu_central
    adequate: false
    transfer_instrument: NONE
    applies_to: [] # catch-all: unmapped-but-open countries, EU storage
