# Redis Sentinel — node 3 (AZ-c). Task 9.3.20, spec §4.5.
# Managed by deploy/systemd/redis-sentinel@.service (no daemonize — systemd
# supervision). Auth lives in the included file (secrets pipeline, never here).
port 26379
bind 0.0.0.0
daemonize no
supervised systemd
dir /var/lib/redis-sentinel
logfile /var/log/redis/sentinel-3.log
pidfile /run/redis-sentinel/sentinel-3.pid

# Announce this sentinel's real address across AZs (no hostnames in the
# failover path — DNS stalls the sentinel event loop; see the 1.3.9 drill
# note in deploy/redis/sentinel.conf).
sentinel announce-ip 10.3.0.13
sentinel announce-port 26379
sentinel resolve-hostnames no

# Coordination instance group "mymaster" = exchange coordination Redis
# (leader leases, mode flags, rate-limit buckets — redis.conf, noeviction).
sentinel monitor mymaster 10.1.0.11 6379 2
sentinel down-after-milliseconds mymaster 2000
sentinel failover-timeout mymaster 5000
sentinel parallel-syncs mymaster 1

# Deny reconfiguration surprises; failover choreography is the drill script's
# job (deploy/crons/redis-failover-drill.sh).
sentinel deny-scripts-reconfig yes

include /etc/redis/sentinel-auth.conf
