; -----------------------------------------------------------------------------
; pgbouncer.ini — exchange transaction pooler (§19.13.1 postgres row)
;
; Deployed to /etc/pgbouncer/pgbouncer.ini on the PostgreSQL hosts, in
; front of the Go services' pgx pools. The unit is the distro
; pgbouncer.service hardened by deploy/systemd/pgbouncer.service.d-
; override.conf (Restart=always, LimitNOFILE).
;
; Task 14.3.6 sizing contract: max_client_conn = 100.
;   The gateway pool (EXC_POSTGRES_MAX_CONNS, config.Postgres.MaxConns)
;   plus every service's pool must fit INSIDE this cap — client
;   connection storms die at the pooler queue, never at postgres
;   max_connections. If a capacity change raises service pool counts,
;   raise this deliberately and re-run the capacity model — never past
;   the PostgreSQL max_connections headroom reserved for admin+replication.
; -----------------------------------------------------------------------------

[databases]
; Connect-through entries — real credentials come from auth_file +
; auth_user, never inline passwords in this file.
exchange = host=127.0.0.1 port=5432 dbname=exchange

[pgbouncer]
; --- connection caps (Task 14.3.6) ---
max_client_conn = 100          ; hard ceiling on inbound client connections
default_pool_size = 20         ; per (db,user) server-side pool
max_db_connections = 100       ; total server-side connections, all pools
max_user_connections = 100     ; per-user server-side ceiling
reserve_pool_size = 5          ; emergency burst allowance on saturation
reserve_pool_timeout = 3       ; seconds a client may wait before 500/timeout

; --- mode ---
pool_mode = transaction        ; spec §5.40 SERIALIZABLE txns are
                               ; statement-boundary-safe; session mode would
                               ; pin a backend per client and defeat pooling
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /var/run/postgresql

; --- auth ---
auth_type = scram-sha-256      ; PG16 default; plaintext never accepted
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer          ; reads passwords server-side via auth_query
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

; --- lifecycle ---
server_reset_query = DISCARD ALL         ; hygiene between transactions
server_reset_query_always = 0            ; skip reset on session-mode-safe paths
server_check_delay = 30
server_check_query = SELECT 1
server_lifetime = 3600                   ; recycle backends hourly (plan cache)
server_idle_timeout = 600                ; reap idle backends
client_idle_timeout = 0                  ; clients may hold idle pools
query_timeout = 0                        ; OLTP statements bound via
                                         ; statement_timeout server-side
query_wait_timeout = 10                  ; queued >10s → error, never hang
ignore_startup_parameters = extra_float_digits

; --- admin ---
admin_users = postgres
stats_users = exchange_monitor
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
