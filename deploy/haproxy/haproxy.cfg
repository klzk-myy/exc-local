# =============================================================================
# deploy/haproxy/haproxy.cfg — Phase-05 Task 5.3.29
# API Gateway / Load Balancer for the order-gateway (Go, port 8080).
#
# Responsibilities OWNED here (edge layer):
#   - TLS termination (cert dir hot-reloads via `haproxy -sf`; crt-list
#     rotation needs no config edit — reload picks up new files)
#   - HTTP path routing REST vs WebSocket upgrade (WS → tunnel mode)
#   - L7 health checks (/health/ready gates traffic; /health/live is the
#     orchestrator probe — never gate traffic on liveness)
#   - blue/green backend selection via a runtime-editable map file
#     (`set map` on the stats socket — zero-downtime colour flip)
#   - client IP preservation (option forwardfor → X-Forwarded-For; the
#     Go gateway trusts it — the gateway listener MUST NOT be directly
#     exposed: firewall it to this host/NLB)
#   - coarse connection/body/frame-size bounds and structured logging
#
# Responsibilities deliberately NOT here (owned by the Go gateway to
# keep a single emitter and avoid divergence):
#   - HSTS / CSP / X-Content-Type-Options / X-Frame-Options /
#     Referrer-Policy / Permissions-Policy / CORS allowlist
#     (services/internal/middleware/security.go)
#   - fine-grained rate limits + progressive IP bans (internal/ratelimit)
#   - the §8.7 error envelope, request ids, idempotency
#   - per-request circuit breaking (Go breaker: 15% errors / 10s window,
#     5s probe backoff — HAProxy is the coarser fleet-level layer)
#
# No secrets live in this file. Certificates come from
# /etc/haproxy/certs/ (provisioned by the secrets pipeline, Phase-13.5
# Task 13.5.3.5).
# =============================================================================

global
    log stdout format raw local0 info
    maxconn 100000
    nbthread 4
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    ssl-default-bind-options ssl-min-ver TLSv1.3 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256
    tune.ssl.default-dh-param 2048

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-keep-alive
    option forwardfor            # X-Forwarded-For: client IP to gateway
    option redispatch
    retries 2                    # idempotent retries only (HAProxy retries GETs safely)
    # ---- timeouts (spec item 7) ----
    timeout connect      5s
    timeout client       30s     # HTTP idle client
    timeout server       30s     # REST calls are sub-second; WS uses tunnel
    timeout http-request 10s     # slowloris bound
    timeout http-keep-alive 10s
    timeout tunnel       4h      # WS long-lived connections (§10.6 ping 30s)
    timeout queue        10s
    timeout check        3s

# -----------------------------------------------------------------------------
# Frontends
# -----------------------------------------------------------------------------

frontend http_in
    bind :80
    mode http
    # Permanent upgrade redirect — nothing is served over plaintext.
    http-request redirect scheme https code 301

frontend https_in
    # crt-list points at a DIRECTORY: all PEMs load; rotation is
    # `haproxy -sf` (socket: `new ssl cert` + `commit ssl cert` for
    # zero-reload rotation is also supported on the admin socket).
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http1.1
    mode http

    # Structured JSON access log — fields chosen to join the gateway's
    # X-Request-ID / X-Trace-ID correlation.
    capture request header X-Request-ID len 40
    capture request header traceparent len 64
    capture request header Idempotency-Key len 64
    capture response header X-Request-ID len 40
    log-format '{"ts":"%Ts","cid":"%ci","cport":%cp,"method":"%HM","uri":"%HU","status":%ST,"bytes":%B,"tms":%Tr,"be":"%b","srv":"%s","req_id":"%[capture.req.hdr(0)]","trace":"%[capture.req.hdr(1)]","idem":"%[capture.req.hdr(2)]"}'

    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443

    # =========================================================================
    # Phase-09 Task 9.3.13 — edge WAF/DDoS controls (spec §19.1, §24 #160).
    # Defense-in-depth UNDERNEATH the Cloudflare-class L3/L4 provider:
    # these ACLs + stick tables are what HAProxy can enforce itself;
    # ModSecurity/OWASP CRS runs as the full-WAF companion (see
    # deploy/edge/README.md for what lives where).
    # =========================================================================

    # ---- geo-block (Phase-21 list lands in the map; edge denies, not app)
    # /etc/haproxy/geo-block.map: one CIDR per line from the sanctioned-
    # jurisdiction feed. Empty map = no denies (dev default).
    acl geo_blocked src -f /etc/haproxy/geo-block.map
    http-request deny status 451 if geo_blocked
    # 451 Unavailable For Legal Reasons — honest signal, logged.

    # ---- request-smuggling protections -------------------------------------
    # HAProxy's strict HTTP parser already rejects ambiguous framing; these
    # explicit denies document + belt the rules. Duplicate Content-Length
    # and CL+TE coexistence are the classic smuggle vectors.
    acl dup_cl      req.hdr_cnt(Content-Length) gt 1
    acl cl_and_te   req.hdr_cnt(Content-Length) gt 0
    acl has_te      req.hdr_cnt(Transfer-Encoding) gt 0
    http-request deny status 400 if dup_cl
    http-request deny status 400 if cl_and_te has_te
    # TE: anything other than chunked terminating the block.
    acl te_not_chunked req.hdr(Transfer-Encoding) !-i -m end chunked
    http-request deny status 400 if has_te te_not_chunked
    # Bare-line methods/URI with embedded ctl chars are parser-rejected;
    # header names with spaces/specials likewise — log+deny a stray
    # Content-Length on methods that must not carry a body either.
    acl has_body_method method GET HEAD OPTIONS
    http-request deny status 400 if has_body_method { req.hdr_cnt(Content-Length) gt 0 }

    # ---- method allowlist ---------------------------------------------------
    # Trading API verbs + CORS preflight. TRACE/TRACK/CONNECT/etc. denied.
    acl method_allowed method GET POST PUT DELETE OPTIONS HEAD
    http-request deny status 405 if !method_allowed

    # ---- coarse request size limits (item 7) ----
    # REST body cap: 1 MiB (spec). WS upgrade requests carry no body;
    # the 64 KiB frame cap is enforced in the gateway (SetReadLimit) —
    # HAProxy tunnelling does not re-inspect frames.
    acl body_too_big req.hdr(content-length) -m int gt 1048576
    http-request deny status 413 if body_too_big

    # ---- per-IP rate + connection limits (stick tables below) --------------
    # Whitelisted trading clients (market makers, prime brokers) skip the
    # flood ladder — see /etc/haproxy/whitelist.map (deploy/edge/).
    acl whitelisted src -f /etc/haproxy/whitelist.map

    # WS upgrade detection declared early: the flood ladder exempts
    # upgrade requests (long-lived tunnels look like floods to a
    # request-rate counter); routing uses it below.
    acl is_websocket hdr(Upgrade) -i websocket
    acl ws_path path_beg /ws/

    # Concurrent-connection cap per source IP.
    tcp-request connection track-sc0 src table st_conn_per_ip
    acl conn_over sc0_conn_cur gt 2000
    tcp-request connection reject if conn_over !whitelisted

    # Request-rate ladder per source IP: abusive when >500 req/10s or
    # sustained error volume >50 err/10s.
    http-request track-sc1 src table st_req_per_ip unless whitelisted
    acl rate_abuse  sc1_http_req_rate(10s,st_req_per_ip) gt 500
    acl err_abuse   sc1_http_err_rate(10s,st_req_per_ip) gt 50
    http-request deny status 429 if rate_abuse !is_websocket !whitelisted
    http-request deny status 429 if err_abuse !is_websocket !whitelisted

    # WS upgrade routing — Connection: Upgrade + Upgrade: websocket.
    http-request set-var(txn.is_ws) bool(true) if is_websocket ws_path

    # ---- blue/green selection (item 4) ----
    # /etc/haproxy/active_color.map contains "gateway blue" or
    # "gateway green". Flip live, no reload:
    #   echo "set map /etc/haproxy/active_color.map gateway green" \
    #     | socat /run/haproxy/admin.sock -
    acl color_green str(green) -m found,map_str(/etc/haproxy/active_color.map,gateway,blue)

    use_backend be_ws_green  if var(txn.is_ws) color_green
    use_backend be_ws_blue   if var(txn.is_ws)
    use_backend be_gateway_green if color_green
    default_backend be_gateway_blue

# -----------------------------------------------------------------------------
# Backends — blue/green pairs, REST and WS share gateway instances but get
# distinct pools so WS connection draining cannot strand REST traffic.
# -----------------------------------------------------------------------------

backend be_gateway_blue
    mode http
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    default-server check inter 2s fall 3 rise 2 init-addr last,libc,none
    server gw-blue-1 10.0.10.11:8080 maxconn 20000
    server gw-blue-2 10.0.10.12:8080 maxconn 20000 backup
    # Drain a server before deploy: set server be_gateway_blue/gw-blue-1 state maint

backend be_gateway_green
    mode http
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    default-server check inter 2s fall 3 rise 2 init-addr last,libc,none
    server gw-green-1 10.0.20.11:8080 maxconn 20000
    server gw-green-2 10.0.20.12:8080 maxconn 20000 backup
    # Both pools: `backup` server is the same-colour warm spare — colour
    # failover is the map flip, not cross-colour backup (blue/green must
    # never bleed traffic mid-release).

backend be_ws_blue
    mode http
    balance source            # sticky-by-IP keeps a client on one WS node
    option httpchk GET /health/ready
    http-check expect status 200
    default-server check inter 2s fall 3 rise 2 init-addr last,libc,none
    server gw-blue-1 10.0.10.11:8080 maxconn 50000
    server gw-blue-2 10.0.10.12:8080 maxconn 50000 backup

backend be_ws_green
    mode http
    balance source
    option httpchk GET /health/ready
    http-check expect status 200
    default-server check inter 2s fall 3 rise 2 init-addr last,libc,none
    server gw-green-1 10.0.20.11:8080 maxconn 50000
    server gw-green-2 10.0.20.12:8080 maxconn 50000 backup

# -----------------------------------------------------------------------------
# Stick tables (Task 9.3.13) — per-IP flood bookkeeping. Named backends,
# never routed to: peers-synced in production (see deploy/edge/README.md).
# -----------------------------------------------------------------------------

# st_conn_per_ip — concurrent connections per source (conn_cur).
backend st_conn_per_ip
    stick-table type ip size 1m expire 60s store conn_cur

# st_req_per_ip — request-rate + error-rate ladders over 10s.
backend st_req_per_ip
    stick-table type ip size 1m expire 10s store http_req_rate(10s),http_err_rate(10s)

# -----------------------------------------------------------------------------
# Stats / ops surface (loopback + ops subnet only — never public).
# -----------------------------------------------------------------------------
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    # Prometheus scrape surface (haproxy exporter reads /stats;csv):
    http-request use-service prometheus-exporter if { path /metrics }
