; supervisord.conf — Phase-09 Task 9.3.28 item 4: single-box development
; orchestration profile mapping the §19.13.1 daemon inventory into the
; deterministic 6-stage topological bootstrap sequence (§19.13.2).
;
; Stage 0 (priority=10) is the compose infra tier — supervisord delegates to
;   `docker compose -f docker-compose.dev.yml` rather than re-provisioning.
; Stages 1-5 run local binaries in dependency order: supervisord starts
;   lower `priority` values first and gates on `startsecs` before ordering
;   the next tier (the "deterministic" part of §19.13.2 — a daemon that
;   cannot hold its startsecs never reaches healthy and later tiers stall,
;   which is the fail-closed ordering guarantee).
;
; Watchdog emulation (dev, multi-tier per §19.13.3):
;   - every long-running program: `autorestart=true` (the supervised
;     analogue of systemd Restart=always);
;   - `exitcodes=0,2` on one-shot programs so a clean exit is not a fault;
;   - stage-0 compose healthchecks emulate Tier-1 systemd watchdog
;     liveness (a container that fails its healthcheck blocks later
;     tiers at `--wait`);
;   - matching-engine pets the same in-process WatchdogThread it does in
;     production — under supervisord NOTIFY_SOCKET is unset so sd_notify
;     is inert (dev supervision = autorestart + startsecs, not
;     WatchdogSec);
;   - exchange-watchdogd runs its real probe matrix against the dev
;     topology (shm ring headers, Redis leader progression, NVMe quota).
;
; Programs run bare-metal `go run ./cmd/<name>` from the repo root —
; supervisord resolves paths relative to %(ENV_REPO)s (default
; /www/wwwroot/exc.local). Set it to the checkout root when different.
;
; Docker alternative (2026-10-02, prod docker redesign, spec §27):
; every daemon in this file also runs via docker-compose.app.yml
; (EXC_APP_MODE=docker), supervised by compose restart/healthchecks —
; in docker mode supervisord is required for nothing (only host PTP
; stays outside compose). supervisord remains the supervisor only for
; bare-metal/host-mode operation.
;
; Log paths: /var/log/exchange/dev/<program>.log (mkdir -p first or point
; SUPERVISOR_LOG_DIR elsewhere; stdout_* are capped + rotated).

[unix_http_server]
file=/var/run/exchange-supervisor.sock

[supervisord]
logfile=/var/log/exchange/dev/supervisord.log
pidfile=/var/run/exchange-supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/exchange-supervisor.sock

; ----------------------------------------------------------------------
; Stage 0 — Clustered infrastructure & clock sync (priority=10)
; PostgreSQL 16 + PgBouncer, Redis 7 Sentinel cluster, ClickHouse, NATS
; JetStream, PTP. Dev delegates the containerized slice to compose;
; ptp4l/phc2sys stay on the host (hardware clock is not a container).
; ----------------------------------------------------------------------
[program:stage0-infra]
command=/bin/sh -c 'docker compose -f %(ENV_REPO)s/docker-compose.dev.yml up -d --wait postgres redis-primary redis-replica-1 redis-replica-2 redis-sentinel-1 redis-sentinel-2 redis-sentinel-3 redis-cache clickhouse nats'
priority=10
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/var/log/exchange/dev/stage0-infra.log
stdout_logfile_maxbytes=20MB

[program:ptp4l]
command=/usr/sbin/ptp4l -i %(ENV_PTP_IFACE)s -m
priority=10
autorestart=true
startsecs=3
autostart=false  ; requires PTP hardware (phase-09:315 env-bound); enable on equipped hosts
stdout_logfile=/var/log/exchange/dev/ptp4l.log

[program:phc2sys]
command=/usr/sbin/phc2sys -s %(ENV_PTP_IFACE)s -w -m
priority=10
autorestart=true
startsecs=3
autostart=false
stdout_logfile=/var/log/exchange/dev/phc2sys.log

; ----------------------------------------------------------------------
; Stage 1 — Bare-metal IPC & node supervisors (priority=20)
; ----------------------------------------------------------------------
[program:aeronmd]
command=/opt/aeron/bin/aeronmd
priority=20
autorestart=true
startsecs=3
autostart=false  ; present only when Aeron driver is installed on the host
stdout_logfile=/var/log/exchange/dev/aeronmd.log

[program:exchange-watchdogd]
command=/bin/sh -c 'cd %(ENV_REPO)s/services && go run ./cmd/watchdogd --shm-base %(ENV_EXC_SHM_BASE)s --redis %(ENV_REDIS_ADDR)s'
priority=20
autorestart=true
startsecs=10
stdout_logfile=/var/log/exchange/dev/watchdogd.log

; ----------------------------------------------------------------------
; Stage 2 — Core matching engine shards (priority=30)
; One program per shard template; instance count mirrors core/. Build via
; `cmake --build core/build` first (bare-metal, never containerized).
; ----------------------------------------------------------------------
[program:matching-engine-0]
; Phase-3 Task 3.3.1: -redis binds the suspension/sanctions/instrument/oracle
; feeds AND the account:state provider (published by program:risk on the same
; coordination Redis). Without it the engine hooks run() with no bound
; IAccountState and every admission rejects ACCOUNT_INACTIVE (fail closed).
command=/bin/sh -c '%(ENV_REPO)s/core/build/matching_engine -shard 0 -ipc-base %(ENV_EXC_SHM_BASE)s -wal-dir %(ENV_EXC_WAL_DIR)s -redis %(ENV_EXC_REDIS_ADDR)s -symbol EUR/USD -instrument-id 1'
priority=30
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=15  ; graceful drain = snapshot + WAL fsync (§19.6)
stdout_logfile=/var/log/exchange/dev/matching-engine-0.log

; Shards 1-7 — the gateway readiness probe fails closed unless EVERY shard
; declared in config/sharding.yaml (0-3 static + 4-7 elastic) stamps a live
; producer into its shm ring. Dev runs one process per shard, same as e2e.
[program:matching-engine-1]
command=/bin/sh -c '%(ENV_REPO)s/core/build/matching_engine -shard 1 -ipc-base %(ENV_EXC_SHM_BASE)s -wal-dir %(ENV_EXC_WAL_DIR)s -redis %(ENV_EXC_REDIS_ADDR)s -symbol EUR/USD -instrument-id 1'
priority=30
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/var/log/exchange/dev/matching-engine-1.log

[program:matching-engine-2]
command=/bin/sh -c '%(ENV_REPO)s/core/build/matching_engine -shard 2 -ipc-base %(ENV_EXC_SHM_BASE)s -wal-dir %(ENV_EXC_WAL_DIR)s -redis %(ENV_EXC_REDIS_ADDR)s -symbol EUR/USD -instrument-id 1'
priority=30
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/var/log/exchange/dev/matching-engine-2.log

