; ----------------------------------------------------------------------
; Cross-shard ctl relay (priority=30, alongside the engine tier)
; Phase-3 Task 4 — routes dst_shard ctl frames between engine processes
; (Aeron IPC is point-to-point per channel alias); load-bearing for
; multi-shard basket 2PC (spec §2.2a). -shards follows the engine set.
; ----------------------------------------------------------------------
[program:xshardrelay]
command=/bin/sh -c 'cd %(ENV_REPO)s/services && go run ./cmd/xshardrelay -shards "${EXC_XSHARD_SHARDS:-0}"'
priority=30
autorestart=true
startsecs=10
stdout_logfile=/var/log/exchange/dev/xshardrelay.log
