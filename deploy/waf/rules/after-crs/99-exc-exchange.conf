# 99-exc-exchange.conf — exchange-specific OWASP CRS tuning, loaded AFTER
# the ruleset (mounted at /opt/modsecurity/rules/after-crs/, included by
# modsecurity.d/setup.conf.template after rules/*.conf).
#
# Nothing is disabled today: at PL1 every production path shape passes —
# verified by deploy/scripts/waf_drill.sh (REST GET 200 + WS upgrade 101).
# When a real false positive is found on an order payload, land the
# targeted exclusion HERE (ctl:ruleRemoveById scoped by REQUEST_URI),
# never by lowering the global paranoia level.
#
# Shape reference for future tuners:
#
#   # Scoped single-rule exemption (preferred — one rule, one endpoint):
#   SecRule REQUEST_URI "@beginsWith /api/v1/orders" \
#       "id:99001,phase:1,pass,nolog,ctl:ruleRemoveById=942190"
#
#   # WS upgrade: CRS inspects the HTTP upgrade request only — frames are
#   # post-upgrade tunnel bytes and are NOT inspected by ModSecurity at
#   # any paranoia level. Frame-level abuse protection lives in the
#   # gateway (Task 6.3.7 WS message rate limiting). No exemption needed:
#   # a well-formed upgrade passes PL1 unchanged.
