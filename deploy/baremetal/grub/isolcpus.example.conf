# GRUB fragment — CPU isolation for the matching host (Task 9.3.1).
# Append these tokens to GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub,
# then `sudo update-grub` and reboot. provision-matching-host.sh --check
# verifies the live /proc/cmdline afterwards.
#
# Layout below matches config/sharding.yaml single-shard hosts with the
# recommended 8-core carve-out on NUMA node 0:
#   cores 0-1 : housekeeping (OS, IRQs, RSS, journald, prometheus node exporter)
#   core  2   : aeronmd conductor
#   core  3   : aeronmd sender
#   core  4   : aeronmd receiver
#   core  5   : matching-engine matching thread (EngineLoop)
#   core  6   : matching-engine WatchdogThread (100µs sampler, spec §19.13.3 t2)
#   core  7   : exchange-watchdogd node probe loop
#
# Scale to your host: keep the whole isolated set on ONE NUMA node and run the
# engine under `numactl --cpunodebind=<that node> --membind=<that node>`.

GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT \
    isolcpus=2,3,4,5,6,7 \
    nohz_full=2,3,4,5,6,7 \
    rcu_nocbs=2,3,4,5,6,7 \
    irqaffinity=0-1 \
    kthread_cpus=0-1 \
    hugepagesz=2M hugepages=2048 \
    nmi_watchdog=0 softlockup_panic=0 \
    transparent_hugepage=madvise \
    intel_pstate=disable"
# intel_pstate=disable + governor=performance is the common low-latency pair;
# on amd_pstate systems use amd_pstate=disable instead. THP stays madvise —
# the WAL mmaps hugepages explicitly (2MB, spec §19.6), global THP adds
# latency jitter to the order-pool arena.
