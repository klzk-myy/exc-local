# /etc/systemd/system.conf.d/50-exchange-watchdog.conf — Tier-1 hardware
# watchdog integration for bare-metal matching hosts (spec §19.13.3 tier 1,
# Phase-09 Task 9.3.28 item 3).
#
# Requires an IPMI/iDRAC BMC watchdog device bound at /dev/watchdog (module
# ipmi_watchdog or equivalent). If the kernel hard-hangs, the BMC reboots the
# host within RuntimeWatchdogSec; on panic/reboot the hardware timer gets a
# ShutdownWatchdogSec grace so a wedged shutdown cannot strand the shard.
[Manager]
RuntimeWatchdogSec=10s
ShutdownWatchdogSec=10min
