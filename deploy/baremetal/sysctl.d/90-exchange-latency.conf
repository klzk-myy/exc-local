# /etc/sysctl.d/90-exchange-latency.conf — persistent low-latency profile for
# bare-metal matching-engine hosts (Phase-09 Task 9.3.1; runtime twin:
# scripts/tune-kernel-network.sh, Task 1.3.10).
#
# Installed by deploy/baremetal/provision-matching-host.sh --apply.

# Aeron media driver socket buffers (aeronmd requests 16MB SO_RCVBUF/SO_SNDBUF —
# Linux clamps at these maxima).
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144

# Kernel busy-poll support for latency-critical sockets.
net.core.busy_read = 50
net.core.busy_poll = 50

# Softirq packet-processing budget — avoid drops under 50k msg/s bursts.
net.core.netdev_budget = 600
net.core.netdev_max_backlog = 4096
net.core.netdev_budget_usecs = 5000

# With nohz_full= on isolated cores, keep the tick from migrating onto them.
kernel.timer_migration = 0

# Disable the RT group runtime cap (default 95% of 1s/period): the matching
# thread may run SCHED_FIFO-adjacent workloads and must never be throttled.
kernel.sched_rt_runtime_us = -1

# Fail-closed crash discipline: panic on oops/hardlockup so the Tier-1
# hardware watchdog (RuntimeWatchdogSec) reboots rather than leaving a
# half-alive matching host holding a leader lease.
kernel.panic_on_oops = 1
kernel.hardlockup_panic = 1
kernel.panic = 10
