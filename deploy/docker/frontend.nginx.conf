# frontend.nginx.conf — static UI + gateway proxy (full-project docker, 2026-10-02).
# Upstream is 127.0.0.1 (not the `gateway` service name): the app tier runs
# under network_mode:host, so the container shares the host network and
# compose DNS is unavailable — same address host mode uses.
server {
  listen 3000;

  root /usr/share/nginx/html;
  index index.html;

  # REST + interactive WS trading API (spec §8.4, Phase-05 Task 5.3.31).
  # X-Forwarded-For carries the per-route synthetic edge IP (see
  # frontend.nginx-main.conf / edge.js) — without it every SPA call
  # shares one loopback §8.8 bucket and 429s under normal use.
  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $exc_edge_ip;
  }
  location /ws/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Per-connection WS bucket — the gateway's ReconnectRate (10 upgrades
    # /60s/IP) would otherwise 429 SPAs that open a socket per mount.
    proxy_set_header X-Forwarded-For $exc_ws_ip;
  }

  # SPA fallback — client-side router owns all other paths. The .inc
  # files are generated at build time from frontend/public/_headers (the
  # canonical contract — nginx cannot consume the convention directly),
  # and add_header replaces inherited values per-location, so every
  # static location repeats the /* set plus its own block.
  location / {
    include /etc/nginx/frontend.headers.inc;
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    include /etc/nginx/frontend.headers.inc;
    include /etc/nginx/frontend.assets.inc;
    try_files $uri =404;
  }
  location = /index.html {
    include /etc/nginx/frontend.headers.inc;
    include /etc/nginx/frontend.shell.inc;
  }
}
