# frontend.nginx.conf — static UI + gateway proxy (full-project docker, 2026-10-02).
# Upstream is 127.0.0.1 (not the `gateway` service name): the app tier runs
# under network_mode:host, so the container shares the host network and
# compose DNS is unavailable — same address host mode uses.
server {
  listen 3000;

  root /usr/share/nginx/html;
  index index.html;

  # REST + interactive WS trading API (spec §8.4, Phase-05 Task 5.3.31).
  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /ws/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # SPA fallback — client-side router owns all other paths.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
