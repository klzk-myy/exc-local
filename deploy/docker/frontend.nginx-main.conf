# frontend.nginx-main.conf — replaces the stock nginx.conf for the
# docker frontend image so ngx_http_js_module can load (load_module is
# main-context only; conf.d includes sit inside http{} and cannot load
# modules). Everything else mirrors the stock config.
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Per-request edge-IP synthesis for the dev stack (LAN clients are
    # not edge-rate-limited; see frontend.edge.js for the model and why
    # it diverges from the Vite path-hash approach).
    js_import edge from /etc/nginx/edge.js;
    js_set $exc_edge_ip edge.xff;
    js_set $exc_ws_ip edge.wsxff;

    include /etc/nginx/conf.d/*.conf;
}
