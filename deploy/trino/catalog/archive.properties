# Cold archive catalog — Hive connector over the S3 partition-archive bucket.
#
# Dev topology (provisioned by deploy/scripts/trino_federation.sh):
#   exc-archive-s3gw  versitygw posix S3 gateway on exc-dev_default,
#                     alias `archive-s3`, container port 17070.
#                     Bucket: exchange-partition-archive — the same bucket name
#                     internal/archiver (DefaultPartitionBucket) writes
#                     {parent}/{partition}/{partition}.parquet + .manifest.json
#                     with COMPLIANCE Object Lock in production.
#
# Metastore: `hive.metastore=file` is an undocumented testing metastore that
# stores catalog JSON on the local filesystem (fs.native-local, rooted at
# local.location). Single-coordinator dev only — production swaps this for the
# thrift HMS (hive.metastore.uri=thrift://hms:9083) or Glue; the S3 filesystem
# block and external_location layout stay identical.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=local:///metastore
local.location=/var/trino
fs.native-local.enabled=true

# Native S3 filesystem (AWS SDK v2) against the local versitygw gateway.
# Path-style + http + static dev creds — versitygw is the dev stand-in for the
# WORM archive bucket; creds match S3_ACCESS/S3_SECRET in trino_federation.sh.
fs.native-s3.enabled=true
s3.endpoint=http://archive-s3:17070
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=trino_dev
s3.aws-secret-key=trino_dev_secret

# Allow registering/querying external parquet objects written out-of-band by
# the archiver (it PUTs objects directly; Trino never owns the bucket layout).
hive.non-managed-table-writes-enabled=true
hive.non-managed-table-creates-enabled=true
hive.storage-format=PARQUET
# Archiver parquet leaves are TIMESTAMP(MICROS) — pg resolution is µs
# (services/internal/archiver/parquet_export.go).
hive.timestamp-precision=MICROSECONDS
