# PostgreSQL catalog — HOT/WARM tiers + archive ledger.
# Maps the dev postgres container (alias `postgres` on exc-dev_default) to a
# Trino catalog named `exchange_pg`. Cold-tier context lives in:
#   public.partition_archive_log / partition_tier_state / partition_tier_log
#   warm.<detached partitions>          (SET SCHEMA warm moves)
#   archive_restore.<restored archive>  (archiver restore re-materialization)
# Production equivalent: read-replica endpoint per docs/ops/data-tiering-policy.md §5.
connector.name=postgresql
connection-url=jdbc:postgresql://postgres:5432/exchange
connection-user=exchange
connection-password=exchange_dev
# Cold/ledger data is read-mostly; keep metadata fresh across archiver moves.
case-insensitive-name-matching=true
