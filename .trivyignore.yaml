# .trivyignore.yaml — path-scoped + expiring CVE exceptions.
# Loaded EXPLICITLY by the CI gate (scripts/ci/scan_images.sh --ignorefile);
# plain `trivy` runs without --ignorefile read only the flat .trivyignore.
#
# `paths` scopes each suppression to the exact vulnerable file inside the
# upstream image — the same CVE reported at a different path (e.g. a binary
# we build ourselves under /opt/exchange/bin) still fails the gate.
# `expired_at` forces periodic re-review: once expired, Trivy reports the
# finding again and the pipeline goes red until the entry is renewed or the
# base image is bumped.
vulnerabilities:
  # ── Alpine openssl in upstream dev-infra images (flat-suppressed in
  #    .trivyignore; repeated here so --ignorefile mode sees it too) ──
  - id: CVE-2026-14456
    expired_at: 2026-12-27
    statement: >-
      openssl 3.5.x DoS (unbounded memory) in libcrypto3/libssl3 of
      nats:2.11-alpine and clickhouse/clickhouse-server:25.8-alpine.
      Fixed by alpine pkg 3.5.8-r0; requires upstream tag republish.
      Dev-infra images only. Review on every base-image bump.
  - id: CVE-2026-45447
    expired_at: 2026-12-27
    statement: >-
      openssl 3.5.x heap UAF in PKCS7_verify (libcrypto3/libssl3) of
      nats:2.11-alpine. Fixed by alpine pkg 3.5.7-r0; requires upstream
      tag republish. Dev-infra image only.

