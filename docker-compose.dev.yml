# Local development infrastructure — single-host, port-separated cluster topology.
# Same topology/config shapes as production per AGENTS.md: PG16, Redis 7 (1 primary +
# 2 replicas + 3 sentinels), ClickHouse, NATS JetStream 3-node. C++ core is NOT here —
# it builds and runs bare-metal.
name: exc-dev

x-redis-common: &redis-common
  image: redis:7.2-alpine
  command: ["redis-server", "/etc/redis/redis.conf"]
  volumes:
    - ./deploy/redis/redis.conf:/etc/redis/redis.conf:ro
  sysctls:
    net.core.somaxconn: 1024

x-nats-common: &nats-common
  image: nats:2.11-alpine
  command: ["-c", "/etc/nats/nats.conf"]

services:
  postgres:
    build:
      context: ./deploy/postgres
    image: exc-postgres:16-partman
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange_dev
      POSTGRES_DB: exchange
    ports:
      - "5433:5432"   # host 5432 is taken by a host-local postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange -d exchange"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-primary:
    <<: *redis-common
    ports: ["16379:6379"]   # host 6379 taken by host-local redis
    volumes:
      - ./deploy/redis/redis.conf:/etc/redis/redis.conf:ro
      - redis-primary-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Pinned redis-ha address (10.99.0.11) — sentinel monitors by IP: a dead
    # container's DNS name stalls sentinel's blocking resolver (+tilt loop,
    # failover never completes; observed in the 1.3.9 drill). Also keep the
    # default network so other compose services can reach it.
    networks:
      default: {}
      redis-ha:
        ipv4_address: 10.99.0.11

  redis-replica-1:
    <<: *redis-common
    command: ["redis-server", "/etc/redis/redis.conf", "--replicaof", "10.99.0.11", "6379"]
    ports: ["16380:6379"]
    volumes:
      - ./deploy/redis/redis.conf:/etc/redis/redis.conf:ro
      - redis-replica1-data:/data
    depends_on: [redis-primary]
    networks:
      default: {}
      redis-ha:
        ipv4_address: 10.99.0.12

  redis-replica-2:
    <<: *redis-common
    command: ["redis-server", "/etc/redis/redis.conf", "--replicaof", "10.99.0.11", "6379"]
    ports: ["16381:6379"]
    volumes:
      - ./deploy/redis/redis.conf:/etc/redis/redis.conf:ro
      - redis-replica2-data:/data
    depends_on: [redis-primary]
    networks:
      default: {}
      redis-ha:
        ipv4_address: 10.99.0.13

  redis-sentinel-1:
    image: redis:7.2-alpine
    command: ["sh", "-c", "cp /etc/redis/sentinel-base.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
    ports: ["36379:26379"]
    volumes:
      - ./deploy/redis/sentinel.conf:/etc/redis/sentinel-base.conf:ro
    depends_on: [redis-primary, redis-replica-1, redis-replica-2]
    networks:
      default: {}
      redis-ha:
        ipv4_address: 10.99.0.21

  redis-sentinel-2:
    image: redis:7.2-alpine
    command: ["sh", "-c", "cp /etc/redis/sentinel-base.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
    ports: ["36380:26379"]
    volumes:
      - ./deploy/redis/sentinel.conf:/etc/redis/sentinel-base.conf:ro
    depends_on: [redis-primary, redis-replica-1, redis-replica-2]
    networks:
      default: {}
      redis-ha:
        ipv4_address: 10.99.0.22

  redis-sentinel-3:
    image: redis:7.2-alpine
    command: ["sh", "-c", "cp /etc/redis/sentinel-base.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
    ports: ["36381:26379"]
    volumes:
      - ./deploy/redis/sentinel.conf:/etc/redis/sentinel-base.conf:ro
    depends_on: [redis-primary, redis-replica-1, redis-replica-2]
    networks:
      default: {}
      redis-ha:
        ipv4_address: 10.99.0.23

  # Second Redis instance for cache keys that need eviction (volatile-lru).
  # Coordination keys live on the noeviction primary topology only (remediation #35).
  redis-cache:
    image: redis:7.2-alpine
    command: ["redis-server", "/etc/redis/redis-cache.conf"]
    ports: ["6382:6379"]
    volumes:
      - ./deploy/redis/redis-cache.conf:/etc/redis/redis-cache.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_USER: exchange
      CLICKHOUSE_PASSWORD: exchange_dev
      CLICKHOUSE_DB: exchange_analytics
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Schema files are idempotent (IF NOT EXISTS) — the entrypoint applies
      # them in lexical order on first boot so an ephemeral `down -v` stack
      # still provisions exchange_analytics tables.
      - ./deploy/clickhouse/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 127.0.0.1, not localhost: on IPv6-disabled docker networks `localhost`
      # resolves to ::1 first and ClickHouse (listen_host 0.0.0.0) refuses it.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    ulimits:
      nofile: 262144

  nats-1:
    <<: *nats-common
    hostname: nats-1
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - ./deploy/nats/nats-1.conf:/etc/nats/nats.conf:ro
      - nats1-data:/data

  nats-2:
    <<: *nats-common
    hostname: nats-2
    ports:
      - "4223:4222"
      - "8223:8222"
    volumes:
      - ./deploy/nats/nats-2.conf:/etc/nats/nats.conf:ro
      - nats2-data:/data

  nats-3:
    <<: *nats-common
    hostname: nats-3
    ports:
      - "4224:4222"
      - "8224:8222"
    volumes:
      - ./deploy/nats/nats-3.conf:/etc/nats/nats.conf:ro
      - nats3-data:/data

  # Trino federated cold-query layer (Task 9.3.24, docs/ops/data-tiering-policy.md
  # §5). Catalogs live in deploy/trino/catalog/ — `exchange_pg` (warm tier +
  # archive ledger on this postgres) and `archive` (Hive + native-S3 over the
  # exchange-partition-archive bucket). The archive S3 gateway
  # (exc-archive-s3gw) and the file-metastore volume chmod are provisioned by
  # deploy/scripts/trino_federation.sh — see deploy/trino/README.md.
  trino:
    # 476→483 (2026-10-01): clears ~120 fixed HIGH/CRITICAL CVEs flagged by
    # the Trivy image gate (el9 OS pkgs + bundled jars); launcher gobinary
    # stdlib CVEs stay path-scoped in .trivyignore.yaml.
    image: trinodb/trino:483
    ports:
      - "18443:8080"
    volumes:
      - ./deploy/trino/catalog:/etc/trino/catalog:ro
      - trino-metastore:/var/trino
    depends_on: [postgres]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/v1/info | grep -q '\"starting\":false' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # --------------------------------------------------------------------------
  # waf — OWASP CRS payload-inspection tier (Task 9.3.13). Intentionally NOT
  # a service in this stack: the dev core runs bare-metal so there is no
  # in-compose backend to proxy, and dev behavior must not change. The WAF
  # stage is self-contained — run it only when verifying edge rules:
  #   docker compose -f deploy/waf/docker-compose.waf.yml up
  #   deploy/scripts/waf_drill.sh
  # (see deploy/waf/README.md)
  # --------------------------------------------------------------------------

networks:
  # Dedicated HA subnet for the coordination Redis topology (Task 1.3.9):
  # fixed IPs let sentinel monitor by IP — no DNS in the failover path —
  # and give host-side clients stable announce_map keys.
  redis-ha:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/24

volumes:
  pgdata:
  redis-primary-data:
  redis-replica1-data:
  redis-replica2-data:
  clickhouse-data:
  nats1-data:
  nats2-data:
  nats3-data:
  trino-metastore:
