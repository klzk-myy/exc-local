# =============================================================================
# Aeron Media Driver — Low-Latency Profile  (spec §2.3, §24 #185)
#
# Canonical property file for the dedicated C media driver (aeronmd).
# Task 1.3.10 — Phase-01 Project Foundation.
#
# Usage:
#   core/third_party/aeron/bin/aeronmd \
#       -Daeron.dir=/dev/shm/exchange-aeron \
#       config/aeron-low-latency.properties
#
# aeronmd maps each `aeron.x.y` property to the env var `AERON_X_Y`
# (aeron_properties_setenv), so every line below is equivalent to exporting
# the upper-snake-case name. Positional args are loaded as properties files;
# -Dname=value flags override file values (later sets win).
#
# Companion pieces:
#   core/include/ipc/AeronDriverConfig.hpp / core/src/ipc/AeronDriverConfig.cpp
#       generate these same properties (and the -D argv) programmatically.
#   scripts/tune-kernel-network.sh
#       applies the matching host-level kernel tuning (socket buffer ceilings,
#       busy-poll, CPU governor). Run it BEFORE starting aeronmd — socket
#       buffers >128KB are silently capped by net.core.{rmem,wmem}_max.
# =============================================================================

# --- Driver threading model --------------------------------------------------
# DEDICATED: conductor, sender and receiver each get their own thread.
# REQUIRED for the affinity pinning below and for the <50us IPC budget.
aeron.threading.mode=DEDICATED

# --- CPU affinity (NUMA core pinning) ----------------------------------------
# Pin each driver thread to an isolated core (isolcpus). -1 = unbound.
# Defaults below are DISABLED deliberately: pinning to non-isolated cores makes
# jitter *worse* (the SDD "unpinned thread jitter" edge case). Set these to the
# cores carved out via isolcpus on the production host — see the guidance block
# printed by scripts/tune-kernel-network.sh. Recommended topology on the
# reference host (2 NUMA nodes): conductor on the matching-engine NUMA node,
# sender/receiver on the NIC-local node.
#aeron.conductor.cpu.affinity=2
#aeron.sender.cpu.affinity=3
#aeron.receiver.cpu.affinity=4

# --- Idle strategies ----------------------------------------------------------
# C driver names: spin (BusySpinIdleStrategy), backoff (BackoffIdleStrategy),
# yield, noop, sleeping. sender/receiver are on the message hot path -> spin.
# conductor handles admin (pub/sub add/remove, client keep-alive) -> backoff
# keeps it responsive without burning a full core on hosts without isolcpus;
# flip to "spin" when an isolated core is dedicated to the conductor.
aeron.sender.idle.strategy=spin
aeron.receiver.idle.strategy=spin
aeron.conductor.idle.strategy=backoff

# --- Term buffers --------------------------------------------------------------
# 128MB term buffers (spec §2.3). Must be power-of-2 in [64KB, 1GB].
# aeron.term.buffer.length        -> network (aeron:udp) publications
# aeron.ipc.term.buffer.length    -> aeron:ipc publications (the hot path)
# Each publication allocates 3 terms + metadata under $aeron.dir; with
# sparse files (below) the pages materialise on demand instead of eagerly.
aeron.term.buffer.length=134217728
aeron.ipc.term.buffer.length=134217728
aeron.term.buffer.sparse.file=true
aeron.file.page.size=4096

# --- MTU ----------------------------------------------------------------------
# 1408B (spec §2.3): one max-size Ethernet frame minus UDP/IP headers, and a
# multiple of the 32B frame alignment. IPC MTU matches so identical framing
# code paths serve both transports.
aeron.mtu.length=1408
aeron.ipc.mtu.length=1408

# --- Socket buffers -------------------------------------------------------------
# 16MB SO_RCVBUF / SO_SNDBUF for aeron:udp endpoints (spec §2.3). Linux clamps
# these to net.core.rmem_max / net.core.wmem_max — the tuning script raises
# both ceilings to 16777216 first. Inert for aeron:ipc but required for the
# multi-node UDP distribution channels.
aeron.socket.so.rcvbuf=16777216
aeron.socket.so.sndbuf=16777216

# --- Housekeeping ---------------------------------------------------------------
# Print the resolved configuration on driver start (verification of the above
# values lands in stdout — grep for term_buffer_length / socket_so_rcvbuf).
aeron.print.configuration=true

# Warn (don't refuse) when reusing a previous aeron.dir; deploy wrappers pass
# -Daeron.dir.delete.on.start=true for disposable dev/bench dirs only.
aeron.dir.warn.if.exists=true

# aeron.dir itself is intentionally NOT set here — it is deployment-specific
# (/dev/shm/exchange-aeron on prod, /tmp/... in bench). Pass -Daeron.dir=...
# or export AERON_DIR. Clients must point at the same dir (AeronChannelConfig
# .aeron_dir / $AERON_DIR).

# --- UDP channel scaffolding knobs (spec §2.3 "aeron:udp multicast") -----------
# Kept at conservative defaults; documented here as the channel-setup surface:
#aeron.socket.multicast.ttl=0          # 0 = same-host only; raise for cross-host MDC
#aeron.send.to.status.poll.ratio=10    # sender SM cadence
#aeron.rcv.status.message.timeout=200ms
# Channel URIs are constructed by AeronDriverConfig (make_udp_endpoint_uri):
#   aeron:udp?endpoint=<host:port>|interface=<if>|ttl=<n>      (unicast / MDS)
#   aeron:udp?endpoint=<group:port>                            (multicast)
#   aeron:ipc?alias=orders_in|orders_out                       (in-NUMA shm)
