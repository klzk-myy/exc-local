# gitleaks config — extends the built-in ruleset (Phase-01.5 Task 1.5.3.4;
# spec §19.2 secret scan, workflow .github/workflows/security.yml).
[extend]
useDefault = true

# Verified false positives. Keep entries exact-token-scoped (regexTarget =
# "secret" + anchored regex): a broad path allowlist would mask a real
# credential pasted into the same file later.
# NOTE: gitleaks 8.x reads the SINGULAR [allowlist] table — the
# [[allowlists]] array form is silently ignored (verified on 8.24.3).
[allowlist]
description = "Verified non-secrets: spec-prose token; localhost drill literals; RFC 6455 sample nonce; test fixture string. Path entry covers the checked-in localhost haproxy test cert (self-signed, expires 48h, drill-only)."
regexTarget = "secret"
regexes = [
  '''^JWT/HMAC/Ed25519$''',
  '''^admin:admin$''',
  '''^dGhlIHNhbXBsZSBub25jZQ==$''',
  '''^itest_lc_p2020_01\.parquet$''',
  '''^sk_live_9f8e7d6c5b4a$''',
  '''^cGVudGVzdC1rZXktMzItYnl0ZXMtc3VmZmljaWVudCEh$''',
  '''^jwt-hs256-key-b64$''',
  '''^exc\.dismissed-announcements\.v1$''',
  '''^018f8b7e-8f6a-4b2c-9d1e-2f3a4b5c6d7e$''',
  '''^EXC_S3_REGION\.$''',
]
paths = ['''^deploy/haproxy/test/certs/localhost\.pem$''']
